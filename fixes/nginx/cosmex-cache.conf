# ─────────────────────────────────────────────────────────────────────────────
# cosmex.ru — исправления слоя кэширования nginx
#
# Закрывает три находки из docs/seo-audit.md:
#   P0-1  метаданные уезжают в <body> на закэшированных карточках товара
#   P1-3  /images/* отдаётся с Cache-Control: max-age=0
#   P1-4  /api/image/proxy отдаёт два конфликтующих Cache-Control + мусорный Vary
#
# Блоки map — в http-контекст, location — в server-контекст.
# ─────────────────────────────────────────────────────────────────────────────


# ═══ P0-1. Разводим кэш на «ботовый» и «пользовательский» варианты ═══════════
#
# Проблема. Next.js отдаёт метаданные по-разному в зависимости от User-Agent:
# ботам из списка htmlLimitedBots — блокирующим образом в <head>, браузерам —
# стримом (теги дописываются в конец <body>, React поднимает их в <head> уже
# на клиенте). Это штатное поведение и само по себе корректно.
#
# Ломается оно на кэше: ключ не учитывает User-Agent, Vary его тоже не содержит,
# поэтому на URL заводится один общий объект. Живых браузеров кратно больше, чем
# ботов, так что в кэш почти всегда попадает стримовый вариант — и следующие
# 300 секунд (+ сутки stale-while-revalidate) он отдаётся Яндексу, Bing, VK,
# Telegram и WhatsApp. Замер: title на 118 623 байте при </head> на 6 746.
#
# Решение. Добавляем в ключ кэша флаг «это бот с ограниченным HTML».
# Получаем ровно два варианта вместо одного — TTFB живым пользователям
# не страдает, а краулеры всегда получают метаданные в <head>.
#
# Список синхронизирован с htmlLimitedBots из Next.js. При обновлении Next
# сверяйтесь с текущим значением, иначе новые боты будут попадать
# в пользовательский вариант кэша.

map $http_user_agent $html_limited_bot {
    default 0;
    "~*(Mediapartners-Google|Slurp|DuckDuckBot|baiduspider|yandex|yeti|naverbot|sogou|bitlybot|tumblr|vkShare|quora link preview|redditbot|ia_archiver|bingbot|BingPreview|applebot|facebookexternalhit|facebookcatalog|Twitterbot|LinkedInBot|Slackbot|Discordbot|WhatsApp|SkypeUriPreview|telegrambot|Google-InspectionTool|GPTBot|OAI-SearchBot|ChatGPT-User|ClaudeBot|PerplexityBot)" 1;
}

# Флаг в ключ кэша. Важно: $html_limited_bot должен присутствовать в ключе
# на КАЖДОМ location, который кэширует HTML-ответы приложения.
proxy_cache_key "$scheme$request_method$host$request_uri$html_limited_bot";

# Отдаём флаг наружу для отладки — видно, какой вариант вернулся.
add_header X-Bot-Variant $html_limited_bot always;

# Проверка после выкатки (два запроса должны отличаться позицией <title>):
#   curl -sA "Mozilla/5.0 (compatible; YandexBot/3.0)" https://cosmex.ru/product/… | grep -bo '<title>'
#   curl -sA "Mozilla/5.0 Chrome/126.0"                 https://cosmex.ru/product/… | grep -bo '<title>'
# У ботового варианта смещение должно быть меньше позиции '</head>'.


# ═══ P1-3. Браузерный кэш для статических изображений ════════════════════════
#
# Было: /images/logo.png и /images/original/workshop/workshop-04.jpg
#       отдаются с `Cache-Control: public, max-age=0`.
# workshop-04.jpg — это LCP-картинка главной (она же в <link rel="preload"
# fetchpriority="high">), 95 554 байт, JPEG. При max-age=0 она перезапрашивается
# при каждом заходе.
#
# Для сравнения, /_next/static/* настроен правильно: max-age=31536000, immutable.

location /images/ {
    # Файлы в /images/ перезаливаются редко и без хеша в имени, поэтому
    # не immutable, а 30 дней + возможность фоновой перепроверки.
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    try_files $uri =404;
}

# Про hero-картинку: одних заголовков мало — она отдаётся как JPEG мимо
# оптимизатора /_next/image. Перевод на next/image описан в fixes/next/images.md.


# ═══ P1-4. Один Cache-Control на прокси изображений ══════════════════════════
#
# Было (два заголовка в одном ответе):
#   cache-control: public, max-age=0, s-maxage=300, stale-while-revalidate=86400
#   cache-control: public, max-age=86400
#   vary: rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch
#
# По RFC 9111 заголовки склеиваются в один список с двумя значениями max-age
# (0 и 86400). Поведение не определено, клиенты берут более строгое — то есть
# фото товаров не кэшируются браузером вообще. На карточке ~40 изображений
# по ~68 КБ, и они перекачиваются на каждом просмотре.
#
# Vary с RSC-заголовками на бинарной картинке смысла не имеет и дробит кэш CDN.

location /api/image/proxy {
    proxy_pass http://next_upstream;

    # Гасим оба заголовка, пришедших от приложения, и ставим свой — ровно один.
    proxy_hide_header Cache-Control;
    proxy_hide_header Vary;
    add_header Cache-Control "public, max-age=86400, s-maxage=604800, stale-while-revalidate=86400" always;
    add_header Vary "Accept" always;   # ответ зависит от поддержки WebP/AVIF, и только

    # Ключ кэша — по самому URL картинки. Флаг бота здесь не нужен:
    # ответ от User-Agent не зависит.
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 7d;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;

    access_log off;
}

# Проверка (должна остаться ровно одна строка Cache-Control):
#   curl -sI 'https://cosmex.ru/api/image/proxy?url=…' | grep -ci '^cache-control'
